name: macOS-CI
on: [push, pull_request]

jobs:
  # https://docs.github.com/en/actions/reference/software-installed-on-github-hosted-runners
  # we install stuff not already there
  macos-build:
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # ccache is incremental, so restore the newest entry and save an updated one per commit
      - name: Cache ccache dir
        uses: actions/cache@v4
        id: cache-ccache
        with:
          path: ~/Library/Caches/ccache
          key: macos-ccache-${{ github.sha }}
          restore-keys: macos-ccache-
      # exact key on the workflow file: changes when the package list changes,
      # prefix fallback keeps the old downloads until then
      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            ~/Library/Caches/pip
            ~/Library/Caches/Homebrew
          key: macos-deps-${{ hashFiles('.github/workflows/macosx-ci.yml') }}
          restore-keys: macos-deps-
      - name: Brew update-reset
        run: brew update-reset
      - name: Brew update
        run: brew update
      - name: Brew install DeJaVu fonts
        run: brew install --cask font-dejavu
      - name: Install environment helpers with homebrew
        run: brew install ccache
      - name: Install openage dependencies with homebrew
        run: brew install cmake python3 libepoxy freetype fontconfig harfbuzz opus opusfile qt6 libogg libpng toml11 eigen
      - name: Install nyan dependencies with homebrew
        run: brew install flex make
      - name: Install python3 packages
        # cython, numpy and pygments are in homebrew,
        # but "cython is keg-only, which means it was not symlinked into /usr/local"
        # numpy pulls gcc as dep? and pygments doesn't work.
        run: pip3 install --upgrade --break-system-packages cython numpy mako lz4 pillow pygments setuptools toml tomli-w
      - name: Configure
        run: ./configure --compiler=clang --mode=release --ccache --download-nyan
      - name: Build
        run: make -j$(sysctl -n hw.logicalcpu) VERBOSE=1
      - name: Test
        run: make test
